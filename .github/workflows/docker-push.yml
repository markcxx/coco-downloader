name: Push Docker Image to Registries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: coco-production
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Generate tags
      id: meta
      run: |
        DOCKER_IMAGE_DOCKERHUB=${{ secrets.DOCKERHUB_USERNAME }}/coco-downloader
        DOCKER_IMAGE_GHCR=ghcr.io/${{ github.repository_owner }}/coco-downloader

        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          TAGS="${DOCKER_IMAGE_DOCKERHUB}:${VERSION},${DOCKER_IMAGE_DOCKERHUB}:latest"
          TAGS="${TAGS},${DOCKER_IMAGE_GHCR}:${VERSION},${DOCKER_IMAGE_GHCR}:latest"
        else
          BRANCH=${GITHUB_REF#refs/heads/}
          BRANCH=${BRANCH//\//-}
          TAGS="${DOCKER_IMAGE_DOCKERHUB}:${BRANCH},${DOCKER_IMAGE_DOCKERHUB}:latest"
          TAGS="${TAGS},${DOCKER_IMAGE_GHCR}:${BRANCH},${DOCKER_IMAGE_GHCR}:latest"
        fi

        TAGS="${TAGS},${DOCKER_IMAGE_GHCR}:${GITHUB_SHA}"
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        echo "### 🏷️ Image Tags" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "${TAGS}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        pull: true
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v4
    - name: Configure SSH
      env:
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
    - name: Deploy CoCo
      env:
        DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GHCR_USER: ${{ github.actor }}
        IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      run: |
        scp -P "$DEPLOY_PORT" deploy/compose.yaml deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/coco-deploy/"
        printf '%s' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
        ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sh /home/ubuntu/coco-deploy/deploy.sh '$IMAGE'"

    - name: Generate summary
      run: |
        echo "## ✅ Docker Images Pushed Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Pull from Docker Hub:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/coco-downloader:latest" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Pull from GitHub Container Registry:" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "docker pull ghcr.io/${{ github.repository_owner }}/coco-downloader:latest" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
